<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S33 – Twin Core</title>
<meta name="description" content="Monophonic two-oscillator semi-modular synthesizer with patch bay, spring reverb and arpeggiator.">
<meta name="theme-color" content="#121110">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Twin Core">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --frame:#1c1b19; --frame2:#262522; --ink:#f4efe4; --mut:rgba(244,239,228,.62); --cream:#efe7d6;
  --mod:#b7841c; --osc:#2c5a9a; --mix:#2a7a68; --flt:#b2412b; --env:#c4691e; --spr:#6b4a8e; --out:#45423d;
}
*{box-sizing:border-box}
html,body{margin:0;background:#121110;color:var(--ink);font:13px/1.3 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;-webkit-user-select:none;user-select:none}
#app{max-width:1440px;margin:0 auto;padding:12px 16px 14px;min-height:100vh;display:flex;flex-direction:column;gap:10px}
/* header */
header{display:grid;grid-template-columns:270px 1fr 440px;gap:12px;align-items:stretch}
.logo{display:flex;flex-direction:column;justify-content:center;padding:6px 4px}
.logo .s{display:flex;align-items:center;gap:10px}
.logo .b{border:2px solid var(--ink);padding:1px 6px;font:700 13px/1.2 "Helvetica Neue",Arial,sans-serif;letter-spacing:.08em}
.logo .n{white-space:nowrap;font:300 22px/1 "Helvetica Neue",Arial,sans-serif;letter-spacing:.32em}
.logo .n b{font-weight:700}.logo .n .tw{color:#e3a832}.logo .n .co{color:#5b8fdc}
.logo .t{margin-top:6px;font-size:9px;letter-spacing:.42em;color:var(--mut)}
.mon{background:#0b0b0a;border:1px solid #2e2c29;border-radius:10px;display:flex;overflow:hidden}
.mon canvas{display:block;width:100%;height:76px}
.side{display:flex;flex-direction:column;gap:6px;justify-content:center}
.side .r{display:flex;gap:6px;align-items:center}
button{font:600 12px/1 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;font-family:inherit;color:var(--ink);background:var(--frame2);border:1px solid #3a3834;border-radius:7px;padding:8px 12px;cursor:pointer}
button:hover{border-color:#5a5750}
button.on{background:var(--ink);color:#111;border-color:var(--ink)}
#st{font-size:11px;color:var(--mut);margin-left:auto;text-align:right;max-width:190px;line-height:1.2}
#pre{flex:1;min-width:0;font:600 12px/1 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--frame2);border:1px solid #3a3834;border-radius:7px;padding:7px 8px}
.mon{position:relative}
.pname{position:absolute;left:12px;top:8px;display:flex;align-items:baseline;gap:8px;pointer-events:none}
.pname span{font-size:9px;letter-spacing:.3em;color:#6e6a62}
.pname b{font:600 14px/1 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;color:#ff9d6a;letter-spacing:.04em}
.pname i{font-style:normal;font-size:9px;letter-spacing:.2em;color:#6e6a62}
.nled{margin-left:6px;font-size:11px;color:var(--mut);display:flex;align-items:center;gap:6px}
.nled b{color:var(--ink);font-variant-numeric:tabular-nums;min-width:28px;display:inline-block}
.dot{width:9px;height:9px;border-radius:50%;background:#3a3834;box-shadow:inset 0 0 0 1px #000}
.dot.on{background:#ff6a3d;box-shadow:0 0 8px #ff6a3d}
/* panel */
.panel{background:var(--frame);border:1px solid #2e2c29;border-radius:14px;padding:10px;display:flex;gap:10px;flex:1}
.rows{display:flex;flex-direction:column;gap:10px;flex:1;min-width:0}
#app{position:relative}
.patch{width:232px;flex:none;background:#0f0f0e;border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;box-shadow:inset 0 0 0 1px #2e2c29}
.patch h2{margin:0 0 6px;font:700 11px/1 "Helvetica Neue",Arial,sans-serif;letter-spacing:.28em;color:var(--mut);display:flex;gap:8px;align-items:center}
.patch h2:after{content:"";flex:1;height:1px;background:#2e2c29}
.jg{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 4px;flex:1;align-content:space-between}
.jgh{grid-column:1/-1;font:700 8px/1 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;letter-spacing:.24em;color:var(--hc);margin-top:3px;border-bottom:2px solid var(--hc);padding-bottom:2px}
.jk{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:crosshair;touch-action:none}
.jk .h{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle,#000 0 34%,#8b867c 38% 52%,#cfc8b8 56% 70%,#5d5951 74%);box-shadow:0 1px 2px #000}
.jk .t{font:700 8px/1.05 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;letter-spacing:.04em;text-align:center;padding:2px 3px;border-radius:3px;white-space:nowrap}
.jk.in .t{color:#ddd6c6}
.jk.out .t{background:var(--cream);color:#111}
.jk.on .h{box-shadow:0 0 0 2px var(--ink)}
.jk.hl .h{box-shadow:0 0 0 2px #ff8a52,0 0 8px #ff8a52}
.jatt{display:flex;flex-direction:column;align-items:center}
.jatt .kn{width:60px}
#cables{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:5}
#cables path{pointer-events:stroke;cursor:pointer}
.rowb{display:flex;gap:10px;flex:1}
.blk{background:var(--c);border-radius:10px;padding:8px 10px 10px;display:flex;flex-direction:column;position:relative;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 -2px 0 rgba(0,0,0,.18)}
.blk h2{margin:0 0 6px;font:700 11px/1 "Helvetica Neue",Arial,sans-serif;letter-spacing:.28em;color:rgba(255,255,255,.92);display:flex;align-items:center;gap:8px}
.blk h2:after{content:"";flex:1;height:1px;background:rgba(255,255,255,.28)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 4px;align-content:center;align-items:center;justify-content:space-around;flex:1}
.sub{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.sub+.sub{border-left:1px solid rgba(255,255,255,.22);padding-left:10px}
.subh{font:600 10px/1 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;letter-spacing:.2em;color:rgba(255,255,255,.75)}
.pair{display:flex;gap:10px;flex:1}
/* knob */
.kn{display:flex;flex-direction:column;align-items:center;width:72px;cursor:ns-resize;touch-action:none}
.kn svg{display:block}
.kn .l{font:600 10px/1.1 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#fff;text-align:center;margin-top:2px;white-space:nowrap}
.kn .v{font-size:10px;color:rgba(255,255,255,.7);font-variant-numeric:tabular-nums;height:12px;white-space:nowrap}
.kn.big{width:96px}
/* segmented selector */
.sel{display:flex;flex-direction:column;align-items:center;gap:3px}
.sel .opts{display:flex;background:rgba(0,0,0,.28);border-radius:7px;padding:2px;gap:2px}
.sel .o{min-width:26px;height:24px;padding:0 5px;display:flex;align-items:center;justify-content:center;border-radius:5px;font:600 10px/1 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;color:rgba(255,255,255,.78);cursor:pointer}
.sel .o:hover{background:rgba(255,255,255,.1)}
.sel .o.on{background:var(--cream);color:#1c1b19}
.sel .o svg{display:block}
.sel .l{font:600 10px/1 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#fff}
/* keyboard row */
.kbrow{display:flex;gap:10px;align-items:stretch;height:132px}
.wheels{display:flex;gap:8px;background:var(--frame);border:1px solid #2e2c29;border-radius:12px;padding:8px}
.wh{display:flex;flex-direction:column;align-items:center;gap:4px}
.wh .w{width:30px;flex:1;border-radius:6px;background:linear-gradient(#0d0d0c,#2a2825 50%,#0d0d0c);position:relative;cursor:ns-resize;touch-action:none;box-shadow:inset 0 0 0 1px #000}
.wh .w i{position:absolute;left:3px;right:3px;height:14px;border-radius:3px;background:var(--cream);box-shadow:0 1px 3px #000}
.wh span{font-size:9px;letter-spacing:.18em;color:var(--mut)}
#kb{flex:1;position:relative;display:flex;border-radius:0 0 8px 8px;overflow:hidden;background:#000;padding-top:4px}
.k{flex:1;background:linear-gradient(#fbf8f1,#e9e3d6);border:1px solid #8d877b;border-top:none;border-radius:0 0 5px 5px;position:relative;touch-action:none}
.k.b{position:absolute;top:4px;height:60%;background:linear-gradient(#2c2b29,#0d0d0c);border:1px solid #000;z-index:2;border-radius:0 0 4px 4px}
.k.on{background:linear-gradient(#f1c97c,#d9a24a)}
.k.b.on{background:linear-gradient(#b8822e,#7a521a)}
.k .lab{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:9px;color:#8d877b}
.arp{background:var(--frame);border:1px solid #2e2c29;border-radius:12px;padding:7px 10px;display:grid;grid-template-columns:auto auto auto;gap:4px 12px;align-items:center}
.arp h3{grid-column:1/-1;margin:0;font:700 10px/1 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;letter-spacing:.28em;color:var(--mut);display:flex;gap:8px;align-items:center}
.arp h3:after{content:"";flex:1;height:1px;background:#2e2c29}
.arp .bt{display:flex;flex-direction:column;gap:6px}
.arp .bt button{padding:7px 10px;font-size:10px;letter-spacing:.14em;width:70px}
.arp .bt button.on{background:#ff8a52;border-color:#ff8a52;color:#111}
.arp .segs{display:flex;flex-direction:column;gap:5px}
.arp .sr{display:flex;align-items:center;gap:6px}
.arp .sr>span{width:34px;font:700 8px/1 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;letter-spacing:.18em;color:var(--mut)}
.arp .sel{flex-direction:row}
.arp .sel .o{min-width:24px;height:20px;font-size:9px}
.arp .sel .l{display:none}
.arp .kns{display:grid;grid-template-columns:repeat(3,auto);gap:0 2px}
.kn.sm{width:50px}
.kn.sm .l{font-size:8px}.kn.sm .v{font-size:9px}
.oct{display:flex;flex-direction:column;gap:6px;justify-content:center;background:var(--frame);border:1px solid #2e2c29;border-radius:12px;padding:8px}
.oct .disp{font:700 15px/1 "SF Mono",Menlo,monospace;color:#ff8a52;background:#0b0b0a;border-radius:6px;padding:6px 0;text-align:center}
.kick{font-size:10px;letter-spacing:.14em;padding:7px 10px;background:rgba(0,0,0,.28);border-color:rgba(255,255,255,.25)}
.kick:active{background:var(--cream);color:#111}
.foot{font-size:10px;color:var(--mut);text-align:center}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="logo"><div class="s"><span class="b">S33</span><span class="n"><b class="tw">TWIN</b> <b class="co">CORE</b></span></div><div class="t">TWO VCO · SEMI-MODULAR</div></div>
  <div class="mon"><canvas id="scope" width="1400" height="152"></canvas><div class="pname"><span>PRESET</span><b id="pn">Init</b><i id="pmod"></i></div></div>
  <div class="side">
    <div class="r"><button id="go">Start audio</button><select id="pre"></select><span class="nled">NOTE <b id="nn">—</b><span id="led" class="dot"></span></span></div>
    <div class="r"><button id="savep">Save as…</button><button id="delp">Delete</button><button id="init">Init</button><span id="st">Audio off.</span></div>
  </div>
</header>
<div class="panel">
  <div class="rows"><div class="rowb" id="row1"></div><div class="rowb" id="row2"></div></div>
  <div class="patch" id="patch"><h2>PATCH</h2><div class="jg" id="jg"></div></div>
</div>
<svg id="cables"></svg>
<div class="kbrow">
  <div class="wheels" id="whl"><div class="wh"><div class="w" id="wPitch"><i></i></div><span>PITCH</span></div><div class="wh"><div class="w" id="wMod"><i></i></div><span>MOD</span></div></div>
  <div class="arp" id="arp"></div>
  <div id="kb"></div>
  <div class="oct"><button id="octUp">Oct +</button><div class="disp" id="octD">0</div><button id="octDn">Oct −</button></div>
</div>
<div class="foot">Knobs: drag up/down (Shift = fine), mouse wheel, double-click to reset. Patch: drag from a jack to another; drag a plugged input away to unplug, or double-click a cable.</div>
</div>
<script>
/* =================== Parameters (state) =================== */
const DEF={
  o1wave:1,o1oct:0,o1pw:0.2,
  o2wave:1,o2oct:0,o2fine:0.07,o2pw:0.2,sync:0,
  m1:0.8,m2:0.6,mn:0,
  hpf:20,cutoff:900,res:0.2,envAmt:0.45,kbd:0.5,
  a:0.005,d:0.35,s:0.6,r:0.2,
  lrate:5,lshape:0,lPitch:0,lFilt:0,lPwm:0,wheel:1,
  glide:0.06,glideMode:1,trig:1,
  vol:0.5,bend:2,
  dwell:0.4,decay:0.6,tone:4200,mix:0.3,
  att:0.5,cables:[],
  arpOn:0,latch:0,arpMode:0,arpRate:3,arpOct:1,bpm:120,gate:0.5,swing:0
};
const KEY="s33-mono2vco-v1";
let P=JSON.parse(JSON.stringify(DEF)); try{ Object.assign(P,JSON.parse(localStorage.getItem(KEY)||"{}")); }catch(e){}
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(P)); }catch(e){} };

/* =================== AudioWorklet =================== */
const WORKLET=`
/* Due VCO in un solo processore (serve per l'hard sync): PolyBLEP con un campione di ritardo,
   così ogni salto (fronte del dente di sega, dell'impulso, reset del sync) è corretto da entrambi i lati. */
class DualVco extends AudioWorkletProcessor{
  static get parameterDescriptors(){ return [
    {name:"note",defaultValue:60,automationRate:"a-rate"},      // semitoni (MIDI)
    {name:"pmod",defaultValue:0,automationRate:"a-rate"},       // semitoni, entrambi i VCO
    {name:"pmod2",defaultValue:0,automationRate:"a-rate"},      // semitoni, solo VCO 2
    {name:"pmod1",defaultValue:0,automationRate:"a-rate"},      // semitoni, solo VCO 1
    {name:"pw1",defaultValue:0.2,automationRate:"a-rate"},
    {name:"pw2",defaultValue:0.2,automationRate:"a-rate"},
    {name:"pwm",defaultValue:0,automationRate:"a-rate"},        // modulazione di larghezza, entrambi
    {name:"oct1",defaultValue:0,automationRate:"k-rate"},
    {name:"oct2",defaultValue:0,automationRate:"k-rate"},
    {name:"fine2",defaultValue:0,automationRate:"k-rate"},
    {name:"wave1",defaultValue:1,automationRate:"k-rate"},
    {name:"wave2",defaultValue:1,automationRate:"k-rate"},
    {name:"sync",defaultValue:0,automationRate:"k-rate"}]; }
  constructor(){ super(); this.p1=0; this.p2=0.37; this.y1=0; this.y2=0; }
  static v(w,p,pw){ if(w===0) return 1-4*Math.abs(p-0.5); if(w===1) return 1-2*p; return p<pw?1:-1; }
  process(_,outputs,par){
    const o1=outputs[0][0], o2=outputs[1][0], n=o1.length, sr=sampleRate, nyq=sr*0.45;
    const g=(a,i)=>a.length>1?a[i]:a[0];
    const w1=Math.round(par.wave1[0]), w2=Math.round(par.wave2[0]), sync=par.sync[0]>0.5;
    const off1=par.oct1[0]*12-69, off2=par.oct2[0]*12+par.fine2[0]-69;
    let p1=this.p1, p2=this.p2, y1=this.y1, y2=this.y2;
    for(let i=0;i<n;i++){
      const nt=g(par.note,i)+g(par.pmod,i), pm=g(par.pwm,i);
      let f1=440*Math.pow(2,(nt+g(par.pmod1,i)+off1)/12), f2=440*Math.pow(2,(nt+g(par.pmod2,i)+off2)/12);
      if(f1>nyq) f1=nyq; if(f2>nyq) f2=nyq;
      const dt1=f1/sr, dt2=f2/sr;
      const pwA=w1===2?0.5+pm:g(par.pw1,i)+pm, pwB=w2===2?0.5+pm:g(par.pw2,i)+pm;
      const pw1=Math.min(0.95,Math.max(0.05,pwA)), pw2=Math.min(0.95,Math.max(0.05,pwB));
      /* ---- VCO 1 ---- */
      const q1=p1; p1+=dt1; let c1=0, wrap1=-1;
      if(w1>=2 && q1<pw1 && p1>=pw1){ const d=(p1-pw1)/dt1; c1+=2*(1-d)*(1-d)/2; y1+=-2*d*d/2; }
      if(p1>=1){ p1-=1; wrap1=p1/dt1; const J=(w1===1)?2:(w1>=2?2:0); // salto verso l'alto al giro (dente: da -1 a +1; impulso: da -1 a +1)
        if(J){ c1+=-J*(1-wrap1)*(1-wrap1)/2; y1+=J*wrap1*wrap1/2; }
        if(w1>=2 && p1>=pw1){ const d=(p1-pw1)/dt1; c1+=2*(1-d)*(1-d)/2; y1+=-2*d*d/2; } }
      const s1=DualVco.v(w1,p1,pw1)+c1;
      /* ---- VCO 2 ---- */
      const q2=p2; p2+=dt2; let c2=0;
      if(w2>=2 && q2<pw2 && p2>=pw2){ const d=(p2-pw2)/dt2; c2+=2*(1-d)*(1-d)/2; y2+=-2*d*d/2; }
      if(p2>=1){ p2-=1; const d=p2/dt2, J=(w2===1||w2>=2)?2:0; if(J){ c2+=-J*(1-d)*(1-d)/2; y2+=J*d*d/2; }
        if(w2>=2 && p2>=pw2){ const d2=(p2-pw2)/dt2; c2+=2*(1-d2)*(1-d2)/2; y2+=-2*d2*d2/2; } }
      if(sync && wrap1>=0){ // il VCO 1 ha chiuso il giro: il VCO 2 riparte da zero
        let pb=p2-wrap1*dt2; if(pb<0) pb+=1; const J=DualVco.v(w2,0,pw2)-DualVco.v(w2,pb,pw2), d=wrap1;
        p2=wrap1*dt2; c2=-J*(1-d)*(1-d)/2; y2+=J*d*d/2; }
      const s2=DualVco.v(w2,p2,pw2)+c2;
      o1[i]=y1; o2[i]=y2; y1=s1; y2=s2;   // un campione di ritardo
    }
    this.p1=p1; this.p2=p2; this.y1=y1; this.y2=y2; return true;
  }
}
/* Ladder a 4 poli (TPT, tanh in ingresso) con taglio in Hz + modulazione in ottave */
class Ladder extends AudioWorkletProcessor{
  static get parameterDescriptors(){ return [
    {name:"cutoff",defaultValue:1000,minValue:20,maxValue:20000,automationRate:"a-rate"},
    {name:"cv",defaultValue:0,automationRate:"a-rate"},
    {name:"res",defaultValue:0.2,minValue:0,maxValue:1,automationRate:"k-rate"}]; }
  constructor(){ super(); this.s=new Float64Array(4); }
  process(inputs,outputs,par){
    const x=inputs[0]&&inputs[0][0], y=outputs[0][0], c=par.cutoff, cv=par.cv, k=par.res[0]*3.95, s=this.s, sr=sampleRate;
    let s0=s[0], s1=s[1], s2=s[2], s3=s[3];
    for(let i=0;i<y.length;i++){
      let fc=(c.length>1?c[i]:c[0])*Math.pow(2,cv.length>1?cv[i]:cv[0]); if(fc<20) fc=20; if(fc>sr*0.45) fc=sr*0.45;
      const g=Math.tan(Math.PI*fc/sr), G=g/(1+g), G2=G*G, a=1-G;
      const S=a*(G2*G*s0+G2*s1+G*s2+s3);
      let u=((x?x[i]:0)-k*S)/(1+k*G2*G2); u=Math.tanh(u);
      let v=G*(u-s0); const y1=v+s0; s0=y1+v;
      v=G*(y1-s1);    const y2=v+s1; s1=y2+v;
      v=G*(y2-s2);    const y3=v+s2; s2=y3+v;
      v=G*(y3-s3);    const y4=v+s3; s3=y4+v;
      y[i]=y4*(1+0.5*k);
    }
    s[0]=s0; s[1]=s1; s[2]=s2; s[3]=s3; return true;
  }
}
/* LFO a 5 forme, uscita da -1 a +1 */
class Lfo extends AudioWorkletProcessor{
  static get parameterDescriptors(){ return [
    {name:"rate",defaultValue:5,automationRate:"k-rate"},{name:"shape",defaultValue:0,automationRate:"k-rate"},
    {name:"rcv",defaultValue:0,automationRate:"a-rate"}]; }   // modulazione della velocità, in ottave
  constructor(){ super(); this.p=0; this.h=0; this.sm=0; }
  process(_,outputs,par){
    const y=outputs[0][0], dt0=par.rate[0]/sampleRate, rc=par.rcv, sh=Math.round(par.shape[0]); let dt=dt0;
    let p=this.p, h=this.h, sm=this.sm; const a=Math.min(1,dt0*60);   // leggera smussatura su quadra e S&H, niente click
    for(let i=0;i<y.length;i++){
      dt=Math.min(0.25,dt0*Math.pow(2,rc.length>1?rc[i]:rc[0])); p+=dt; if(p>=1){ p-=1; h=Math.random()*2-1; }

  let b=block("row1","MODULATION","mod","2.3"), c=area(b);
  knob(c,{k:"lrate",label:"Rate",min:0.05,max:40,log:1,fmt:v=>v.toFixed(v<1?2:1)+" Hz"});
  sel(c,{k:"lshape",label:"Wave",opts:[[0,I.tri,"Triangle"],[1,I.sq,"Square"],[2,I.saw,"Sawtooth"],[3,I.ramp,"Ramp"],[4,I.sh,"Sample & Hold"]]});
  knob(c,{k:"lPitch",label:"Pitch Amt",min:0,max:1,fmt:v=>(v*2).toFixed(2)+" st"});
  knob(c,{k:"lFilt",label:"Filter Amt",min:0,max:1,fmt:v=>(v*3).toFixed(1)+" oct"});
  knob(c,{k:"lPwm",label:"PWM Amt",min:0,max:1,fmt:fPct});
  sel(c,{k:"wheel",label:"Pitch Amt via",opts:[[0,"ALWAYS"],[1,"MOD WHEEL"]]});

  b=block("row1","OSCILLATORS","osc","4.2"); const pr=area(b,"pair");
  let s=area(pr,"sub"); s.innerHTML='<div class="subh">VCO 1</div>'; c=area(s);
  sel(c,{k:"o1wave",label:"Wave",opts:WAVE_OPTS}); sel(c,{k:"o1oct",label:"Octave",opts:FEET});
  knob(c,{k:"o1pw",label:"Pulse Width",min:0.05,max:0.5,fmt:fPct});
  s=area(pr,"sub"); s.innerHTML='<div class="subh">VCO 2</div>'; c=area(s);
  sel(c,{k:"o2wave",label:"Wave",opts:WAVE_OPTS}); sel(c,{k:"o2oct",label:"Octave",opts:FEET});
  knob(c,{k:"o2fine",label:"Frequency",min:-7,max:7,step:0.01,fmt:v=>(v>0?"+":"")+v.toFixed(2)+" st"});
  knob(c,{k:"o2pw",label:"Pulse Width",min:0.05,max:0.5,fmt:fPct});
  sel(c,{k:"sync",label:"Hard Sync",opts:[[0,"OFF"],[1,"ON"]]});

  b=block("row1","MIXER","mix","1.6"); c=area(b);
  knob(c,{k:"m1",label:"VCO 1",min:0,max:1}); knob(c,{k:"m2",label:"VCO 2",min:0,max:1}); knob(c,{k:"mn",label:"Noise",min:0,max:1});

  /* ----- Row 2: Filter · Envelope · Output ----- */
  b=block("row2","FILTER","flt","3.3"); c=area(b); c.style.alignItems="center";
  knob(c,{k:"hpf",label:"Highpass",min:20,max:2000,log:1,fmt:fHz});
  knob(c,{k:"cutoff",label:"Cutoff",min:20,max:18000,log:1,fmt:fHz,big:1});
  knob(c,{k:"res",label:"Resonance",min:0,max:1});
  knob(c,{k:"envAmt",label:"Env Amt",min:-1,max:1,fmt:v=>(v>0?"+":"")+(v*6).toFixed(1)+" oct"});
  knob(c,{k:"kbd",label:"Kb Track",min:0,max:1,fmt:fPct});

  b=block("row2","ENVELOPE","env","2.9"); c=area(b); c.style.alignItems="center";
  knob(c,{k:"a",label:"Attack",min:0.002,max:5,log:1,fmt:fS}); knob(c,{k:"d",label:"Decay",min:0.005,max:8,log:1,fmt:fS});
  knob(c,{k:"s",label:"Sustain",min:0,max:1,fmt:fPct}); knob(c,{k:"r",label:"Release",min:0.005,max:8,log:1,fmt:fS});
  sel(c,{k:"trig",label:"Trigger",opts:[[0,"RETRIG"],[1,"LEGATO"]]});

  b=block("row2","SPRING REVERB","spr","2.6"); c=area(b); c.style.alignItems="center";
  knob(c,{k:"dwell",label:"Dwell",min:0,max:1,fmt:fPct}); knob(c,{k:"decay",label:"Decay",min:0,max:1,fmt:fPct});
  knob(c,{k:"tone",label:"Tone",min:1500,max:7000,log:1,fmt:fHz}); knob(c,{k:"mix",label:"Mix",min:0,max:1,fmt:fPct});
  const kick=document.createElement("button"); kick.className="kick"; kick.textContent="KICK"; kick.title="Kick the tank"; kick.onpointerdown=e=>{ e.preventDefault(); kickTank(); }; c.appendChild(kick);
  b=block("row2","OUTPUT","out","2.4"); c=area(b); c.style.alignItems="center";
  knob(c,{k:"glide",label:"Glide",min:0.001,max:1.5,log:1,fmt:v=>v<0.0015?"off":fS(v)});
  sel(c,{k:"glideMode",label:"Glide Mode",opts:[[0,"ALWAYS"],[1,"LEGATO"]]});
  knob(c,{k:"bend",label:"Bend Range",min:1,max:12,step:1,fmt:v=>"±"+Math.round(v)+" st"});
  knob(c,{k:"vol",label:"Volume",min:0,max:1,big:1,fmt:fPct});
}

/* =================== Arpeggiator panel =================== */
function buildArp(){ const a=document.getElementById("arp");
  a.innerHTML=`<h3>ARPEGGIATOR</h3><div class="bt"><button id="arpOn">ARP</button><button id="latch">LATCH</button></div><div class="segs"></div><div class="kns"></div>`;
  const tb=(id,k)=>{ const b=document.getElementById(id); const show=()=>b.classList.toggle("on",!!P[k]); b.onclick=()=>{ P[k]=P[k]?0:1; show(); save(); modified(); if(k==="arpOn"||(k==="latch"&&!P.latch)) allOff(); }; show(); ctrls.push(show); };
  tb("arpOn","arpOn"); tb("latch","latch");
  const sg=a.querySelector(".segs"), row=(lab,o)=>{ const r=document.createElement("div"); r.className="sr"; r.innerHTML=`<span>${lab}</span>`; sel(r,o); sg.appendChild(r); };
  row("MODE",{k:"arpMode",label:"",opts:[[0,"UP"],[1,"DN"],[2,"U/D"],[3,"RND"],[4,"ORD"]]});
  row("RATE",{k:"arpRate",label:"",opts:[[0,"1/4"],[1,"1/8"],[2,"1/8T"],[3,"1/16"],[4,"1/16T"],[5,"1/32"]]});
  row("OCT",{k:"arpOct",label:"",opts:[[1,"1"],[2,"2"],[3,"3"],[4,"4"]]});
  const kn=a.querySelector(".kns");
  knob(kn,{k:"bpm",label:"Tempo",min:40,max:240,step:1,sm:1,fmt:v=>Math.round(v)+" bpm"});
  knob(kn,{k:"gate",label:"Gate",min:0.05,max:1,sm:1,fmt:fPct});
  knob(kn,{k:"swing",label:"Swing",min:0,max:0.6,sm:1,fmt:fPct});
}

const UKEY="s33-mono2vco-user";
let user=[]; try{ user=JSON.parse(localStorage.getItem(UKEY)||"[]"); }catch(e){}
const saveUser=()=>{ try{ localStorage.setItem(UKEY,JSON.stringify(user)); }catch(e){} };
const preSel=document.getElementById("pre");
function fillPre(v){ const grp={}; PRESETS.forEach(([g,n],i)=>(grp[g]=grp[g]||[]).push(`<option value="f${i}">${n}</option>`));
  preSel.innerHTML=Object.entries(grp).map(([g,o])=>`<optgroup label="${g}">${o.join("")}</optgroup>`).join("")
    +(user.length?`<optgroup label="My Presets">${user.map((u,i)=>`<option value="u${i}">${u.name.replace(/</g,"&lt;")}</option>`).join("")}</optgroup>`:"");
  if(v) preSel.value=v; }
function setName(n){ P.name=n; document.getElementById("pn").textContent=n; document.getElementById("pmod").textContent=""; }
function modified(){ document.getElementById("pmod").textContent="· MODIFIED"; }
function loadPreset(data,name){ const keep={vol:P.vol,bend:P.bend};
  allOff(); P=Object.assign(JSON.parse(JSON.stringify(DEF)),JSON.parse(JSON.stringify(data)),keep); setName(name); save();
  ctrls.forEach(f=>f()); applyAll(); rewire(); drawCables(); }
preSel.onchange=()=>{ const v=preSel.value; if(v[0]==="f"){ const p=PRESETS[+v.slice(1)]; loadPreset(p[2],p[1]); } else { const u=user[+v.slice(1)]; loadPreset(u.data,u.name); } preSel.blur(); };
document.getElementById("savep").onclick=()=>{ const n=(prompt("Preset name",P.name&&P.name!=="Init"?P.name:"")||"").trim(); if(!n) return;
  const d=JSON.parse(JSON.stringify(P)); delete d.name; const i=user.findIndex(u=>u.name===n);
  if(i>=0){ if(!confirm(`Replace "${n}"?`)) return; user[i].data=d; } else user.push({name:n,data:d});
  saveUser(); setName(n); save(); fillPre("u"+user.findIndex(u=>u.name===n)); };
document.getElementById("delp").onclick=()=>{ const v=preSel.value; if(v[0]!=="u"){ document.getElementById("st").textContent="Only your own presets can be deleted."; return; }
  const u=user[+v.slice(1)]; if(!confirm(`Delete "${u.name}"?`)) return; user.splice(+v.slice(1),1); saveUser(); fillPre("f0"); };

/* =================== Patchbay =================== */
/* output in crema (come le uscite sui Moog), ingressi scuri; i cavi su un ingresso sostituiscono il collegamento interno */
const JACKS=[
 ["MOD","mod",[["lfoOut","LFO","out"],["envOut","ENV","out"],["kbOut","KB CV","out"],["lrateIn","LFO RATE","in"],["pmodIn","PITCH MOD","in"],["pwmIn","PWM MOD","in"]]],
 ["OSC","osc",[["vco1Out","VCO 1","out"],["vco2Out","VCO 2","out"],["noiseOut","NOISE","out"],["p1In","VCO1 PITCH","in"],["p2In","VCO2 PITCH","in"],["extIn","MIX EXT","in"]]],
 ["FILTER · VCA","flt",[["mixOut","MIX","out"],["filtOut","FILTER","out"],["vcaOut","VCA","out"],["filtIn","FILTER IN","in"],["cutIn","CUTOFF MOD","in"],["vcaIn","VCA IN","in"],["vcaCv","VCA CV","in"],["revIn","SPRING IN","in"]]],
 ["UTILITIES","out",[["multIn","MULT IN","in"],["mult1","MULT","out"],["mult2","MULT","out"],["attIn","ATTEN IN","in"],["attOut","ATTEN","out"]]]
];
const JTYPE={}, JEL={};
const CCOL=["#f2c14e","#e4572e","#4ea5d9","#7bc47f","#f08bd6","#efe7d6"];
function buildPatch(){
  const jg=document.getElementById("jg");
  JACKS.forEach(([title,col,list])=>{
    jg.insertAdjacentHTML("beforeend",`<div class="jgh" style="--hc:var(--${col})">${title}</div>`);
    list.forEach(([id,label,type])=>{ JTYPE[id]=type; const d=document.createElement("div"); d.className="jk "+type; d.dataset.j=id;
      d.innerHTML=`<div class="h"></div><div class="t">${label}</div>`; jg.appendChild(d); JEL[id]=d; });
    if(title==="UTILITIES"){ const a=document.createElement("div"); a.className="jatt"; jg.appendChild(a); knob(a,{k:"att",label:"Atten",min:-1,max:1,fmt:v=>(v>0?"+":"")+v.toFixed(2)}); }
  });
  jg.addEventListener("pointerdown",jackDown);
}
const svg=document.getElementById("cables"), app=document.getElementById("app");
let pdrag=null;
const jpos=id=>{ const r=JEL[id].querySelector(".h").getBoundingClientRect(), a=app.getBoundingClientRect(); return [r.left+r.width/2-a.left,r.top+r.height/2-a.top]; };
const curve=([x1,y1],[x2,y2])=>{ const sag=40+Math.hypot(x2-x1,y2-y1)*0.35; return `M${x1} ${y1} C${x1} ${y1+sag} ${x2} ${y2+sag} ${x2} ${y2}`; };
function drawCables(){
  let h="";
  P.cables.forEach(([o,i],n)=>{ if(!JEL[o]||!JEL[i]) return; const c=CCOL[n%CCOL.length], d=curve(jpos(o),jpos(i));
    h+=`<path d="${d}" stroke="rgba(0,0,0,.5)" stroke-width="7" fill="none" transform="translate(1.5 3)"/><path data-c="${n}" d="${d}" stroke="${c}" stroke-width="5" fill="none" stroke-linecap="round"/>`; });
  if(pdrag) h+=`<path d="${curve(pdrag.a,pdrag.b)}" stroke="${CCOL[P.cables.length%CCOL.length]}" stroke-width="5" fill="none" stroke-dasharray="7 5" stroke-linecap="round" style="pointer-events:none"/>`;
  svg.innerHTML=h;
  Object.entries(JEL).forEach(([id,el])=>el.classList.toggle("on",P.cables.some(c=>c[0]===id||c[1]===id)));
}
svg.addEventListener("dblclick",e=>{ const n=e.target.dataset&&e.target.dataset.c; if(n===undefined) return; P.cables.splice(+n,1); save(); rewire(); drawCables(); modified(); });
function jackDown(e){ const el=e.target.closest(".jk"); if(!el) return; e.preventDefault(); let id=el.dataset.j;
  // un ingresso già collegato: si stacca il cavo e lo si porta in mano dal suo capo d'uscita
  if(JTYPE[id]==="in"){ const k=P.cables.findIndex(c=>c[1]===id); if(k>=0){ id=P.cables[k][0]; P.cables.splice(k,1); rewire(); } }
  const a=app.getBoundingClientRect(); pdrag={from:id,a:jpos(id),b:[e.clientX-a.left,e.clientY-a.top]};
  hlTargets(true); drawCables();
  const mv=ev=>{ pdrag.b=[ev.clientX-a.left,ev.clientY-a.top]; drawCables(); };
  const up=ev=>{ removeEventListener("pointermove",mv); removeEventListener("pointerup",up);
    const t=document.elementFromPoint(ev.clientX,ev.clientY), tj=t&&t.closest&&t.closest(".jk"); hlTargets(false);
    if(tj){ const to=tj.dataset.j, from=pdrag.from; if(JTYPE[to]!==JTYPE[from]){ const o=JTYPE[from]==="out"?from:to, i=JTYPE[from]==="out"?to:from;
        P.cables=P.cables.filter(c=>c[1]!==i); P.cables.push([o,i]); } }
    pdrag=null; save(); rewire(); drawCables(); modified(); };
  addEventListener("pointermove",mv); addEventListener("pointerup",up);
}
function hlTargets(on){ Object.entries(JEL).forEach(([id,el])=>el.classList.toggle("hl",on&&pdrag&&JTYPE[id]!==JTYPE[pdrag.from])); }
addEventListener("resize",drawCables);

/* ---- wheels ---- */
function wheel(id,cb,spring,init){ const w=document.getElementById(id), i=w.querySelector("i"); let v=init;
  const show=()=>{ const h=w.clientHeight-14; i.style.top=((1-v)*h)+"px"; };
  const set=y=>{ const r=w.getBoundingClientRect(); v=Math.max(0,Math.min(1,1-(y-r.top-7)/(r.height-14))); show(); cb(v); };
  w.addEventListener("pointerdown",e=>{ e.preventDefault(); w.setPointerCapture(e.pointerId); w._d=true; set(e.clientY); });
  w.addEventListener("pointermove",e=>{ if(w._d) set(e.clientY); });
  const end=()=>{ w._d=false; if(spring){ v=0.5; show(); cb(v); } };
  w.addEventListener("pointerup",end); w.addEventListener("pointercancel",end);
  requestAnimationFrame(show); addEventListener("resize",show); return {set:x=>{ v=x; show(); }}; }
const WH={pitch:wheel("wPitch",v=>setBend((v-0.5)*2),true,0.5), mod:wheel("wMod",v=>setWheel(v),false,0)};

/* ---- keyboard (3 octaves) + octave shift ---- */
let octShift=0; const KB0=48, KBN=37, keyEl={};
function buildKeys(){ const kb=document.getElementById("kb"); kb.innerHTML=""; for(const n in keyEl) delete keyEl[n];
  const base=KB0+octShift*12, isB=n=>[1,3,6,8,10].includes(n%12), whites=[];
  for(let n=base;n<base+KBN;n++) if(!isB(n)) whites.push(n);
  const W=100/whites.length;
  whites.forEach(n=>{ const k=document.createElement("div"); k.className="k"; if(n%12===0) k.innerHTML=`<span class="lab">C${Math.floor(n/12)-1}</span>`; kb.appendChild(k); keyEl[n]=k; bindKey(k,n); });
  for(let n=base;n<base+KBN;n++){ if(!isB(n)) continue; const k=document.createElement("div"); k.className="k b"; k.style.left=`calc(${(whites.indexOf(n-1)+1)*W}% - ${W*0.3}%)`; k.style.width=W*0.6+"%"; kb.appendChild(k); keyEl[n]=k; bindKey(k,n); }
  held.forEach(n=>key(n,true)); document.getElementById("octD").textContent=(octShift>0?"+":"")+octShift; }
function bindKey(k,n){ k.addEventListener("pointerdown",e=>{ e.preventDefault(); k.setPointerCapture(e.pointerId); noteOn(n); }); const up=()=>noteOff(n); k.addEventListener("pointerup",up); k.addEventListener("pointercancel",up); }
const key=(n,on)=>{ const k=keyEl[n]; if(k) k.classList.toggle("on",on); };
document.getElementById("octUp").onclick=()=>{ if(octShift<3){ octShift++; buildKeys(); } };
document.getElementById("octDn").onclick=()=>{ if(octShift>-3){ octShift--; buildKeys(); } };
const KM={a:0,w:1,s:2,e:3,d:4,f:5,t:6,g:7,y:8,h:9,u:10,j:11,k:12};
const comp=new Map();
addEventListener("keydown",e=>{ if(e.repeat||e.metaKey||e.ctrlKey) return; const o=KM[e.key]; if(o===undefined) return; const n=60+octShift*12+o; comp.set(e.key,n); noteOn(n); });
addEventListener("keyup",e=>{ const n=comp.get(e.key); if(n!==undefined){ comp.delete(e.key); noteOff(n); } });
addEventListener("blur",allOff);

/* ---- MIDI ---- */
function initMidi(){ const st=document.getElementById("st");
  if(!navigator.requestMIDIAccess){ st.textContent="No MIDI here: use Chrome"; return; }
  navigator.requestMIDIAccess().then(a=>{ const hook=()=>{ let c=0; a.inputs.forEach(i=>{ c++; i.onmidimessage=ev=>{ const [s,d1,d2]=ev.data, cmd=s&0xf0;
      if(cmd===0x90&&d2>0) noteOn(d1); else if(cmd===0x80||(cmd===0x90&&d2===0)) noteOff(d1);
      else if(cmd===0xE0){ const v=((d2<<7|d1)-8192)/8192; setBend(v); WH.pitch.set(v/2+0.5); }
      else if(cmd===0xB0&&d1===1){ setWheel(d2/127); WH.mod.set(d2/127); } else if(cmd===0xB0&&(d1===123||d1===120)) allOff(); }; });
    st.textContent="MIDI inputs: "+c; }; hook(); a.onstatechange=hook; })
  .catch(()=>{ st.textContent="MIDI denied: use A–K keys"; }); }

/* ---- oscilloscope ---- */
const cv=document.getElementById("scope"), cx=cv.getContext("2d"); let buf=null;
function frame(){ requestAnimationFrame(frame); const W=cv.width, H=cv.height; cx.fillStyle="#0b0b0a"; cx.fillRect(0,0,W,H);
  cx.strokeStyle="#1f1e1c"; cx.lineWidth=1; cx.beginPath(); for(let x=0;x<=W;x+=W/16){ cx.moveTo(x,0); cx.lineTo(x,H); } cx.moveTo(0,H/2); cx.lineTo(W,H/2); cx.stroke();
  if(!E) return; buf=buf||new Float32Array(E.an.fftSize); E.an.getFloatTimeDomainData(buf);
  let s=0; for(let i=1;i<buf.length/2;i++){ if(buf[i-1]<0&&buf[i]>=0){ s=i; break; } }
  cx.strokeStyle="#ff8a52"; cx.lineWidth=2.4; cx.shadowColor="#ff8a52"; cx.shadowBlur=6; cx.beginPath(); const N=1024;
  for(let i=0;i<N;i++){ const x=i/N*W, y=H/2-(buf[s+i]||0)*H*1.1; i?cx.lineTo(x,y):cx.moveTo(x,y); } cx.stroke(); cx.shadowBlur=0; }

document.getElementById("go").onclick=async e=>{ if(ctx) return; const b=e.currentTarget; b.textContent="Starting…";
  try{ await startAudio(); b.textContent="Audio on"; b.classList.add("on"); initMidi(); }
  catch(err){ ctx=null; b.textContent="Start audio"; document.getElementById("st").textContent="Unable to start the audio: "+(err&&err.message||err); } };
document.getElementById("init").onclick=()=>{ loadPreset({},"Init"); fillPre("f0"); };
document.addEventListener("contextmenu",e=>{ if(e.target.closest(".kn,.k,.w")) e.preventDefault(); });
buildPanel(); buildPatch(); buildArp(); buildKeys(); fillPre(); { const i=PRESETS.findIndex(p=>p[1]===P.name), u=user.findIndex(x=>x.name===P.name); preSel.value=i>=0?"f"+i:u>=0?"u"+u:""; setName(P.name||"Init"); } requestAnimationFrame(frame); requestAnimationFrame(drawCables);
/* PWA: il service worker funziona solo da http(s); aperta come file locale l'app va comunque */
if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
  addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}
</script>
